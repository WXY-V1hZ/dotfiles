# 字体配置
font_size        14

# 背景颜色
background #282828

# 窗口内边距
window_padding_width 0 5 0 5

# 退出时的确认提示
confirm_os_window_close 0

# 历史记录缓存大小（MB）
scrollback_pager_history_size 20

# 按键映射: Ctrl+Backspace → Ctrl+W
map ctrl+backspace send_text all \x17

# 永远显示标签页
tab_bar_min_tabs 2

# 光标拖尾动画
cursor_trail 3
cursor_trail_decay 0.175 0.425
cursor_trail_start_threshold 2

# 模糊
background_opacity 0.95
background_blur 1

allow_remote_control yes


# BEGIN_KITTY_FONTS
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
